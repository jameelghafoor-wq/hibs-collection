<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Discover distinctive luxury fragrances composed in small batches by NOIR ÉLIXIR."
    />
    <meta name="theme-color" content="#080706" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>NOIR ÉLIXIR — Scent That Defines You</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./script.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="site-header">
        <a class="brand-mark" href="#/" aria-label="Noir Élixir home">
          <span class="brand-monogram">N<span>E</span></span>
          <span class="brand-wordmark">NOIR <i>ÉLIXIR</i></span>
        </a>
        <button class="icon-button menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" data-action="menu">
          <span class="menu-lines"></span>
        </button>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="#/">Home</a>
          <a href="#/collections">Collections</a>
          <a href="#/shop">Fragrances</a>
          <a href="#/story">Our Story</a>
          <a href="#/contact">Contact</a>
        </nav>
        <div class="header-actions">
          <button class="icon-button" type="button" aria-label="Search fragrances" data-action="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
          </button>
          <button class="icon-button bag-button" type="button" aria-label="Open shopping bag" data-action="cart">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l1 13H4L5 8Z"></path><path d="M9 9V6a3 3 0 0 1 6 0v3"></path></svg>
            <span class="bag-count" data-cart-count>0</span>
          </button>
        </div>
      </header>
      <main id="main-content"></main>
      <footer class="site-footer" id="site-footer"></footer>
      <div class="overlay-root" id="overlay-root"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </body>
</html>
